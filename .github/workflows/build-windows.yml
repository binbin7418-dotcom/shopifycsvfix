name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller shopifycsvfix.spec
      - name: Package
        run: Compress-Archive -Path dist/ShopifyCsvFix -DestinationPath ShopifyCsvFix-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShopifyCsvFix-Windows
          path: ShopifyCsvFix-Windows.zip
